name: .NET 10 WASM Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WASM Release
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 for Windows
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Restore Windows application
        run: dotnet restore src/Platforms/MissionPlanner.Browser/MissionPlanner.Browser.csproj

      - name: Build Windows application
        run: >-
          dotnet build
          src/Platforms/MissionPlanner.Browser/MissionPlanner.Browser.csproj
          --configuration Release
          --no-restore
          -p:Platform=x64

  