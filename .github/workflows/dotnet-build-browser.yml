name: .NET 11 WASM Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WASM Release
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 11 for WebAssembly
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          workloads: wasm-tools

      - name: Restore browser application
        run: dotnet restore src/Platforms/MissionPlanner.Browser/MissionPlanner.Browser.csproj

      - name: Build browser application
        run: >-
          dotnet build
          src/Platforms/MissionPlanner.Browser/MissionPlanner.Browser.csproj
          --configuration Release
          --no-restore
