name: .NET 10 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 for Windows
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Restore Windows application
        run: dotnet restore src/Platforms/MissionPlanner.Desktop/MissionPlanner.Desktop.csproj

      - name: Build Windows application
        run: >-
          dotnet build
          src/Platforms/MissionPlanner.Desktop/MissionPlanner.Desktop.csproj
          --configuration Release
          --no-restore
          -p:Platform=x64

      - name: Run unit tests
        shell: pwsh
        run: |
          # A failing suite must fail the step even when a later suite passes.
          $projects = @(
            'MissionPlanner.Tests',
            'MissionPlanner.Core.Tests',
            'MissionPlanner.Analysis.Tests',
            'MissionPlanner.Firmware.Tests',
            'MissionPlanner.AvaloniaUI.Tests',
            'MissionPlanner.BrowserBridge.Tests',
            'MissionPlanner.Smoke.Simulator.Tests'
          )
          $failed = @()
          foreach ($project in $projects) {
            dotnet test "src/Tests/$project/$project.csproj" --configuration Release --verbosity normal
            if ($LASTEXITCODE -ne 0) { $failed += $project }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed test projects: $($failed -join ', ')"
            exit 1
          }

      - name: Run browser platform tests
        run: node --test src/Tests/browser-platform.test.mjs

  build-linux:
    name: Build and test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Linux application
        run: >-
          dotnet publish
          src/Platforms/MissionPlanner.Linux/MissionPlanner.Linux.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained

      # The platform-neutral suites also guard path separators and case-sensitive file names.
      # They are reported but do not block until they have been green on Linux for a while.
      - name: Run portable unit tests
        continue-on-error: true
        run: |
          dotnet test src/Tests/MissionPlanner.Tests/MissionPlanner.Tests.csproj --configuration Release
          dotnet test src/Tests/MissionPlanner.Core.Tests/MissionPlanner.Core.Tests.csproj --configuration Release
          dotnet test src/Tests/MissionPlanner.Analysis.Tests/MissionPlanner.Analysis.Tests.csproj --configuration Release
          dotnet test src/Tests/MissionPlanner.Firmware.Tests/MissionPlanner.Firmware.Tests.csproj --configuration Release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish macOS application
        run: >-
          dotnet publish
          src/Platforms/MissionPlanner.MacOs/MissionPlanner.MacOs.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained
          --output out/osx-arm64

      - name: Create the app bundle
        run: scripts/create-macos-bundle.sh out/osx-arm64 out 2.0.0
